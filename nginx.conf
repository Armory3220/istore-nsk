server {
    listen 80;
    server_name istore.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name istore.localhost;

    ssl_certificate     /etc/nginx/certs/istore.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/istore.localhost-key.pem;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
